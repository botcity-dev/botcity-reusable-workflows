name: Docker Vulnerability Scan Reusable

on:
  workflow_call:
    inputs:
      docker-file:
        required: false
        type: string
        default: 'Dockerfile'
      docker-image:
        required: true
        type: string
      build-command:
        required: true
        type: string
      with-maven:
        required: false
        type: boolean
        default: false
      java-version:
        required: false
        type: string
        default: '21'
      java-distribution:
        required: false
        type: string
        default: 'temurin'
      with-aws-login:
        required: false
        type: boolean
        default: false
      aws-region:
        required: false
        type: string
        default: 'us-east-1'
      aws-ecr-registry:
        required: false
        type: string
        default: 'NOT SET'

    secrets:
      NEXUS_USERNAME:
        required: false
      NEXUS_PASSWORD:
        required: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  vulnerability-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ inputs.java-version }}
        if: ${{ inputs.with-maven }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ inputs.java-version }}
          distribution: ${{ inputs.java-distribution }}
          cache: maven

      - name: Configure AWS credentials
        if: ${{ inputs.with-aws-login }}
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ inputs.aws-region }}

      - name: Login AWS ECR
        if: ${{ inputs.with-aws-login }}
        run: |
          aws ecr get-login-password --region ${{ inputs.aws-region }} | docker login --username AWS --password-stdin ${{ inputs.aws-ecr-registry }}

      - name: Build Docker image
        run: ${{ inputs.build-command }}
        env:
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}

      - name: Create Grype config file to ignore some vulnerabilities (e.g. CVE-2026-22184) which was misclassified
        run: |
          cat <<EOF > .grype.yaml
          ignore:
            # OOB write in zlib's untgz demo utility (contrib/untgz/untgz.c), not the core zlib library — demo binary not shipped in our images, so not exploitable. Disputed; EPSS ~0.
            - vulnerability: CVE-2026-22184
            # Python imaplib not used anywhere in this service; upstream won't-fix on 3.14
            - vulnerability: CVE-2025-15366
            # Python poplib not used anywhere; upstream won't-fix on 3.14
            - vulnerability: CVE-2025-15367
            # Only affects in-tree dev builds of CPython; our image is an installed interpreter
            - vulnerability: CVE-2026-12003
            # FP (feed lag): fixed in CPython 3.14.7 / gh-153030; Grype feed lists fixed-in 3.15.0b4 only. Remove once NVD/GHSA publish 3.14.x range.
            - vulnerability: CVE-2026-15308
            # FP (feed lag): tarfile data/tar filter symlink escape, fixed in CPython 3.14.7 / gh-151558; Grype feed lists fixed-in 3.15.0b4 only. Remove once NVD/GHSA publish 3.14.x range.
            - vulnerability: CVE-2026-11940
            # FP (feed lag): tarfile streaming-mode EOF infinite loop, fixed in CPython 3.14.7 / gh-151981; Grype feed lists fixed-in 3.15.0b4 only. Remove once NVD/GHSA publish 3.14.x range.
            - vulnerability: CVE-2026-11972
            # FP (feed lag): configparser write() newline injection, fixed in CPython 3.14.7 / gh-143927; Grype feed lists fixed-in 3.15.0b4 only. Remove once NVD/GHSA publish 3.14.x range.
            - vulnerability: CVE-2026-0864
          EOF

      - name: Scan Docker image with Anchore (Grype)
        uses: anchore/scan-action@v7
        with:
          cache-db: false
          image: ${{ inputs.docker-image }}
          fail-build: false
          output-format: table
          output-file: grype-output.txt
          only-fixed: true

      - name: Capture scan output to use in issues/comments
        id: capture
        run: |
          echo 'RESULT<<EOF' >> $GITHUB_OUTPUT
          cat grype-output.txt >> $GITHUB_OUTPUT
          echo 'EOF' >> $GITHUB_OUTPUT

      - name: Count number of vulnerabilities
        id: vuln_check
        run: |
          # Skip header, exclude empty lines, and count only rows where last column is High or Critical
          VULN_COUNT=$(tail -n +2 grype-output.txt | awk '$0 ~ /[[:space:]](High|Critical)[[:space:]]/' | wc -l)
          echo "count=$VULN_COUNT" >> $GITHUB_OUTPUT

      - name: Authenticate GH CLI
        run: echo "${{ secrets.GITHUB_TOKEN }}" | gh auth login --with-token

      - name: Sync vulnerability issue state
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        env:
          ISSUE_TITLE: "Docker Vulnerability Scan Report - ${{ inputs.docker-file }}"
          ISSUE_BODY: |
            ## 🛡️ Docker Image Vulnerability Scan
            Trigger: `${{ github.event_name }}`
            ```
            ${{ steps.capture.outputs.RESULT }}
            ```
          VULN_COUNT: ${{ steps.vuln_check.outputs.count }}
        run: |
          ISSUE_NUMBER=$(gh issue list --state open --search "$ISSUE_TITLE in:title" --json number,title -q '.[] | select(.title=="'"$ISSUE_TITLE"'") | .number')

          if [ "$VULN_COUNT" != "0" ]; then
            if [ -z "$ISSUE_NUMBER" ]; then
              gh issue create --title "$ISSUE_TITLE" --body "$ISSUE_BODY" --label security
            else
              gh issue edit "$ISSUE_NUMBER" --body "$ISSUE_BODY"
            fi
          elif [ -n "$ISSUE_NUMBER" ]; then
            gh issue comment "$ISSUE_NUMBER" --body "✅ No more High/Critical vulnerabilities detected as of \`${{ github.sha }}\` on \`${{ github.ref_name }}\` (trigger: \`${{ github.event_name }}\`)."
            gh issue close "$ISSUE_NUMBER" --reason completed
          fi

      - name: Comment on PR with scan results
        if: github.event_name == 'pull_request'
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            ## 🛡️ Docker Image Vulnerability Scan - ${{ inputs.docker-file }}
            ```
            ${{ steps.capture.outputs.RESULT }}
            ```

      - name: Fail workflow if vulnerabilities found (on PR)
        if: github.event_name == 'pull_request' && steps.vuln_check.outputs.count != '0'
        run: |
          echo "Vulnerabilities found in PR — failing the workflow."
          exit 1
